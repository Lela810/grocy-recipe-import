name: Auto Update Requirements

on:
    schedule:
        - cron: "0 4 * * 1"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-requirements:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Update pinned dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade -r requirements.txt
                  python - <<'PY'
                  from importlib import metadata
                  from pathlib import Path

                  requirements_file = Path("requirements.txt")
                  package_names = []

                  for raw_line in requirements_file.read_text(encoding="utf-8").splitlines():
                      line = raw_line.strip()
                      if not line or line.startswith("#"):
                          continue
                      package_names.append(line.split("==", 1)[0].strip())

                  updated_lines = []
                  for package_name in package_names:
                      version = metadata.version(package_name)
                      updated_lines.append(f"{package_name}=={version}")

                  requirements_file.write_text("\n".join(updated_lines) + "\n", encoding="utf-8")
                  PY

            - name: Detect changes
              id: changes
              run: |
                  if git diff --quiet -- requirements.txt; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit and push updates
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add requirements.txt
                  git commit -m "chore(deps): auto-update requirements"
                  git push
